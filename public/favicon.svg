<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="#181614" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#woodGrad)" stroke="#f59e0b" stroke-width="8" />
  
  <!-- CNC Cutter / Tool Icon with Holy Halo / Icon Motif -->
  <!-- Halo Ring -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-dasharray="8 6" opacity="0.85" />
  
  <!-- Traditional Carved Cross / Axis -->
  <path d="M 240 100 L 272 100 L 272 360 L 240 360 Z" fill="url(#goldGrad)" />
  <path d="M 150 190 L 362 190 L 362 222 L 150 222 Z" fill="url(#goldGrad)" />
  
  <!-- CNC Endmill Drill bit point -->
  <polygon points="256,430 220,350 292,350" fill="#f59e0b" stroke="#ffffff" stroke-width="4" />
  <line x1="256" y1="350" x2="256" y2="426" stroke="#451a03" stroke-width="4" />
</svg>
